# Baja los datos de ESPN cada 5 minutos y los guarda en la carpeta "datos".
# Este archivo tiene que estar en: .github/workflows/datos.yml
name: Actualizar datos
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar datos de ESPN
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone

          API = os.environ.get('ESPN_API', 'https://site.api.espn.com/apis')
          SALIDA = os.environ.get('SALIDA', 'datos')
          # clave: (código de ESPN, días hacia atrás, tiene tabla de posiciones)
          COMPS = {
              'lpf': ('arg.1', 80, True),
              'arg': ('arg.copa', 150, False),
              'lib': ('conmebol.libertadores', 120, True),
              'sud': ('conmebol.sudamericana', 120, True),
          }
          KEEP = {'gamesPlayed', 'wins', 'ties', 'losses', 'pointsFor', 'pointsAgainst', 'points', 'rank'}


          def get(url):
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code == 400:
                          raise
                      time.sleep(2)
                  except Exception:
                      time.sleep(2)
              return None


          def rango(slug, a, b, prof=0):
              """Devuelve (eventos, ok). Si el servidor responde 400, parte el rango."""
              url = f'{API}/site/v2/sports/soccer/{slug}/scoreboard?dates={a:%Y%m%d}-{b:%Y%m%d}'
              try:
                  d = get(url)
                  return (d.get('events') or [], True) if d is not None else ([], False)
              except urllib.error.HTTPError:
                  if (b - a).days > 3 and prof < 3:
                      m = a + (b - a) // 2
                      e1, ok1 = rango(slug, a, m, prof + 1)
                      e2, ok2 = rango(slug, m + timedelta(days=1), b, prof + 1)
                      return e1 + e2, ok1 and ok2
                  return [], False


          def goles(s):
              if isinstance(s, dict):
                  return s.get('displayValue', s.get('value'))
              return s


          def recortar_evento(ev):
              c = (ev.get('competitions') or [{}])[0]
              t = (ev.get('status') or {}).get('type') or {}
              return {
                  'id': ev.get('id'), 'date': ev.get('date'),
                  'status': {'type': {'state': t.get('state'), 'shortDetail': t.get('shortDetail')},
                             'displayClock': (ev.get('status') or {}).get('displayClock')},
                  'season': {'slug': (ev.get('season') or {}).get('slug')},
                  'competitions': [{
                      'notes': [{'headline': n.get('headline') or n.get('text')} for n in (c.get('notes') or [])],
                      'type': {'text': (c.get('type') or {}).get('text'), 'abbreviation': (c.get('type') or {}).get('abbreviation')},
                      'competitors': [{
                          'homeAway': x.get('homeAway'), 'score': goles(x.get('score')), 'winner': x.get('winner'),
                          'team': {k: (x.get('team') or {}).get(k) for k in ('id', 'displayName', 'name', 'logo')},
                      } for x in (c.get('competitors') or [])],
                  }],
              }


          def recortar_pos(d):
              def grupo(g):
                  out = []
                  for e in (g.get('standings') or {}).get('entries') or []:
                      tm = e.get('team') or {}
                      out.append({
                          'team': {'id': tm.get('id'), 'displayName': tm.get('displayName'),
                                   'logos': [{'href': l.get('href')} for l in (tm.get('logos') or [])[:1]]},
                          'note': {'description': e['note'].get('description')} if e.get('note') else None,
                          'stats': [{'name': s.get('name'), 'value': s.get('value')} for s in (e.get('stats') or []) if s.get('name') in KEEP],
                      })
                  return {'name': g.get('name') or g.get('abbreviation'), 'standings': {'entries': out}}
              hijos = d.get('children') or [d]
              return {'name': d.get('name'), 'abbreviation': d.get('abbreviation'),
                      'seasons': [{'displayName': s.get('displayName')} for s in (d.get('seasons') or []) if isinstance(s, dict)],
                      'children': [grupo(g) for g in hijos]}


          def leer(ruta):
              try:
                  with open(ruta, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return None


          os.makedirs(SALIDA, exist_ok=True)
          hoy = datetime.now(timezone.utc).date()
          for k, (slug, dias, tabla) in COMPS.items():
              ruta = os.path.join(SALIDA, k + '.json')
              viejo = leer(ruta) or {}
              eventos, todo_ok = {}, True
              a, fin = hoy - timedelta(days=dias), hoy + timedelta(days=45)
              while a <= fin:
                  b = min(a + timedelta(days=39), fin)
                  evs, ok = rango(slug, a, b)
                  todo_ok = todo_ok and ok
                  for ev in evs:
                      eventos[ev.get('id')] = recortar_evento(ev)
                  a = b + timedelta(days=1)
              pos = None
              if tabla:
                  try:
                      d = get(f'{API}/v2/sports/soccer/{slug}/standings')
                      pos = recortar_pos(d) if d else viejo.get('posiciones')
                  except Exception:
                      pos = viejo.get('posiciones')
              lista = sorted(eventos.values(), key=lambda e: e.get('date') or '')
              if not lista and viejo.get('eventos'):
                  lista = viejo['eventos']          # si ESPN no respondió, se conserva lo anterior
              nuevo = {'posiciones': pos, 'eventos': lista}
              if {x: viejo.get(x) for x in nuevo} == nuevo:
                  print(k, 'sin cambios')
                  continue
              nuevo['actualizado'] = datetime.now(timezone.utc).isoformat(timespec='seconds')
              with open(ruta, 'w', encoding='utf-8') as f:
                  json.dump(nuevo, f, ensure_ascii=False, separators=(',', ':'))
              print(k, 'actualizado:', len(lista), 'partidos', '' if todo_ok else '(algunos tramos fallaron)')

          PY
      - name: Guardar cambios
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add datos
          git diff --staged --quiet || (git commit -m "Actualizar datos" && git push)
